services:
  - type: web
    name: orca-marine
    runtime: python
    buildCommand: |
      pip install -r backend/requirements.txt
      cd frontend && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ORCA_DATA_MODE
        value: LIVE
      - key: ORCA_USE_LLM
        value: "1"
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: MOSDAC_USER
        sync: false
      - key: MOSDAC_PASS
        sync: false
    healthCheckPath: /api/health
